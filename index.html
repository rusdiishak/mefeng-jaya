<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" id="meta-description" content="">
  <title id="page-title"></title>
  <link rel="icon" type="image/jpeg" href="assets/logo-yayasan-mefeng-jaya.jpg">
  <link rel="alternate icon" type="image/jpeg" href="assets/logo-yayasan-mefeng-jaya.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" id="skip-link" href="#main-content"></a>
  <header class="site-header">
    <nav class="navbar navbar-expand-lg bg-body-tertiary container-xxl px-3 px-lg-4" aria-label="">
      <a class="navbar-brand brand" href="#home" aria-label="">
        <img class="brand-logo" src="assets/logo-yayasan-mefeng-jaya.jpg" alt="">
        <span data-content="brand_name"></span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#site-menu" aria-controls="site-menu" aria-expanded="false" aria-label="">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse nav-menu" id="site-menu">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">
          <li class="nav-item"><a class="nav-link" href="#home" data-content="nav_home"></a></li>
          <li class="nav-item"><a class="nav-link" href="#about" data-content="nav_about"></a></li>
          <li class="nav-item"><a class="nav-link" href="#gallery" data-content="nav_gallery"></a></li>
          <li class="nav-item"><a class="nav-link" href="#contact" data-content="nav_contact"></a></li>
          <li class="nav-item"><button class="nav-cta" type="button" data-scroll-to="messages" data-content="nav_message"></button></li>
        </ul>
      </div>
    </nav>
  </header>

  <main id="main-content">
    <section class="hero" id="home">
      <div class="container hero-grid">
        <div class="hero-copy">
          <p class="eyebrow" data-content="hero_eyebrow"></p>
          <h1 data-content="hero_title"></h1>
          <p class="hero-text" id="profile-description" data-content="hero_description"></p>
          <div class="hero-actions">
            <a class="button button-primary" href="#about"><span data-content="hero_about_button"></span> <span aria-hidden="true">→</span></a>
            <button class="button button-ghost" type="button" data-scroll-to="messages" data-content="hero_contact_button"></button>
          </div>
          <div class="hero-proof">
            <span class="proof-icon" aria-hidden="true">✦</span>
            <span><strong data-content="hero_proof_strong"></strong><br><span data-content="hero_proof_text"></span></span>
          </div>
        </div>
        <div class="hero-art" aria-label="" role="img">
          <img class="profile-image" id="profile-image" src="" alt="" hidden>
          <div class="art-circle"></div>
          <div class="art-card art-card-top"><span aria-hidden="true">✎</span><b data-content="art_card_top"></b><small data-content="art_card_top_small"></small></div>
          <div class="art-card art-card-bottom"><span aria-hidden="true">★</span><b data-content="art_card_bottom"></b><small data-content="art_card_bottom_small"></small></div>
          <div class="art-person"><span class="person-head"></span><span class="person-body"></span></div>
          <div class="art-book" aria-hidden="true"></div>
        </div>
      </div>
      <div class="hero-wave" aria-hidden="true"></div>
    </section>

    <section class="section about" id="about">
      <div class="container about-grid">
        <div class="section-heading">
          <p class="eyebrow" data-content="about_eyebrow"></p>
          <h2 data-content="about_title"></h2>
        </div>
        <div class="about-copy">
          <p data-content="about_paragraph_1"></p>
          <p data-content="about_paragraph_2"></p>
          <a class="text-link" href="#contact"><span data-content="about_link"></span> <span aria-hidden="true">↗</span></a>
        </div>
      </div>
      <div class="container stats" aria-label="">
        <div class="stat"><strong data-stat="stat_1_value"></strong><span data-stat="stat_1_text"></span></div>
        <div class="stat"><strong data-stat="stat_2_value"></strong><span data-stat="stat_2_text"></span></div>
        <div class="stat"><strong data-stat="stat_3_value"></strong><span data-stat="stat_3_text"></span></div>
      </div>
    </section>

    <section class="section gallery-section" id="gallery">
      <div class="container">
        <div class="section-heading gallery-heading">
          <div><p class="eyebrow" data-content="gallery_eyebrow"></p><h2 data-content="gallery_title"></h2></div>
          <p data-content="gallery_intro"></p>
        </div>
        <div class="gallery-grid" id="gallery-grid" aria-live="polite"></div>
      </div>
    </section>

    <section class="section contact-section" id="contact">
      <div class="container contact-wrap">
        <div class="contact-grid">
          <div class="contact-info">
            <p class="eyebrow" data-content="contact_eyebrow"></p>
            <h2 data-content="contact_title"></h2>
            <p class="contact-intro" id="profile-tagline" data-content="contact_intro"></p>
            <div class="contact-details">
              <a class="contact-item" id="profile-email-link" href=""><span class="icon-badge"><i class="fa-solid fa-envelope"></i></span><span id="profile-email"></span></a>
              <a class="contact-item" id="profile-phone-link" href=""><span class="icon-badge"><i class="fa-solid fa-phone"></i></span><span id="profile-phone"></span></a>
              <div class="contact-item"><span class="icon-badge"><i class="fa-solid fa-location-dot"></i></span><span id="profile-address"></span></div>
            </div>
            <div class="social-links" aria-label="">
              <a id="instagram-link" href="" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-instagram"></i></a>
              <a id="facebook-link" href="" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-facebook-f"></i></a>
              <a id="youtube-link" href="" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-youtube"></i></a>
            </div>
          </div>
          <div class="map-card" aria-label="">
            <div class="map-header"><span class="map-pin"><i class="fa-solid fa-location-crosshairs"></i></span><div><small data-content="map_label"></small><strong data-content="map_name"></strong></div></div>
            <iframe id="map-frame" title="" src="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
          </div>
        </div>
        <div class="modal-backdrop" id="messages" hidden>
          <div class="form-card contact-form" role="dialog" aria-modal="true" aria-labelledby="message-title">
            <button class="modal-close" type="button" aria-label=""><span aria-hidden="true">&times;</span></button>
            <p class="eyebrow" data-content="message_form_label"></p>
            <h3 id="message-title" data-content="message_form_title"></h3>
            <form id="contact-form" novalidate>
              <label for="name" data-content="field_name"></label><input id="name" name="name" type="text" autocomplete="name" minlength="2" maxlength="120" required>
              <label for="email" data-content="field_email"></label><input id="email" name="email" type="email" autocomplete="email" maxlength="190" required>
              <label for="phone" data-content="field_phone"></label><input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" maxlength="20" required>
              <label for="address" data-content="field_address"></label><input id="address" name="address" type="text" autocomplete="street-address" minlength="10" maxlength="255" required>
              <label for="message" data-content="field_message"></label><textarea id="message" name="message" rows="4" minlength="20" maxlength="1000" required></textarea>
              <button class="button button-primary" type="submit"><span data-content="form_submit"></span> <span aria-hidden="true">→</span></button>
              <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner"><p id="footer-text"></p><a href="#home" class="footer-back"><span data-content="footer_back"></span> ↑</a></div>
  </footer>
  <script src="assets/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
